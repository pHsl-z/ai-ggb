<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI GGB</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
    <div id="app">
        <div id="geogebra-container"></div>

        <div id="chat-panel" class="panel" style="top:60px;left:0;width:380px;height:520px;">
            <div class="panel-header" id="panel-header">
                <span class="conn-dot" id="conn-dot" title="未连接"></span>
                <span class="panel-title">AI GGB</span>
                <div class="mode-dropdown" id="mode-dropdown">
                    <button class="mode-dropdown-btn" id="mode-dropdown-btn">
                        <span class="mode-dropdown-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        </span>
                        <span class="mode-dropdown-label" id="mode-dropdown-label">聊天</span>
                        <span class="mode-dropdown-arrow">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </span>
                    </button>
                    <div class="mode-dropdown-menu" id="mode-dropdown-menu">
                        <div class="mode-dropdown-item active" data-mode="chat">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            <span>聊天</span>
                        </div>
                        <div class="mode-dropdown-item" data-mode="command">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                            <span>命令</span>
                        </div>
                        <div class="mode-dropdown-item" data-mode="reverse">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                            <span>反推</span>
                        </div>
                    </div>
                </div>
                <div class="header-spacer"></div>
                <span class="mode-badge" id="mode-toggle" title="点击切换几何/函数模式">几何</span>
                <div class="panel-actions">
                    <button class="icon-btn" id="btn-show-problem" title="显示题目">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    </button>
                    <button class="icon-btn" id="btn-new-conv" title="新建对话">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button class="icon-btn" id="btn-history" title="历史">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </button>
                    <button class="icon-btn" id="btn-config" title="设置">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06-.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </button>
                    <button class="icon-btn close-btn-small" id="btn-close" title="关闭">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>

            <div class="panel-body" id="panel-body">
                <div id="view-chat" class="view active">
                    <div id="messages-list"></div>
                    <form id="chat-form" autocomplete="off">
                        <div class="input-row">
                            <input type="text" id="chat-input" placeholder="输入问题…">
                            <button type="submit" id="send-btn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            </button>
                            <button type="button" id="stop-btn" class="hidden" title="停止生成">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                            </button>
                        </div>
                    </form>
                </div>
                <div id="view-command" class="view">
                    <div id="command-output"></div>
                    <form id="command-form" autocomplete="off">
                        <div class="input-row">
                            <input type="text" id="command-input" placeholder="输入GeoGebra命令，如 Point(1,2)">
                            <button type="submit" id="command-send-btn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            </button>
                        </div>
                    </form>
                </div>

                <div id="view-history" class="view">
                    <div class="view-header">
                        <span class="view-title">历史记录</span>
                    </div>
                    <div id="history-list"></div>
                </div>
            </div>

            <div class="resize-handle" id="resize-handle"></div>
        </div>

        <div id="minimized-btn" class="minimized-btn hidden" title="AI GGB">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
    </div>

    <div id="config-modal" class="modal">
        <div class="modal-overlay" id="config-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">设置</span>
                <button class="icon-btn" id="btn-close-config">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>模型提供商</label>
                    <select id="provider-select"></select>
                </div>
                <div class="form-group">
                    <label>模型</label>
                    <select id="model-select"></select>
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="api-key" placeholder="输入 API Key">
                </div>
                <div class="form-group">
                    <label>API 地址</label>
                    <input type="text" id="base-url" placeholder="留空使用默认">
                </div>
                <div class="form-group">
                    <label>温度</label>
                    <input type="number" id="temperature" value="0.7" step="0.1" min="0" max="2">
                </div>
                <div class="form-group">
                    <label>系统提示词</label>
                    <textarea id="system-prompt" rows="3" placeholder="自定义系统提示词"></textarea>
                </div>
                <div class="divider"></div>
                <div class="form-group">
                    <label class="checkbox-label"><input type="checkbox" id="use-proxy"> 启用 CORS 代理</label>
                </div>
                <div class="form-group">
                    <label>代理地址</label>
                    <input type="text" id="proxy-url" placeholder="https://your-proxy.workers.dev">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="btn-save-config">保存</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
